name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile repository scripts
        run: python -m compileall -q scripts

      - name: Build complete reference manifest
        run: python scripts/build_manifest.py

      - name: Verify generated templates
        run: python scripts/sync_templates.py --check

      - name: Run repository validator
        run: python scripts/validate.py

      - name: Install pinned Agent Skills reference validator
        run: >-
          python -m pip install --disable-pip-version-check
          "git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"

      - name: Validate official Agent Skills format
        run: skills-ref validate skills/ultra-web-design

      - name: Reject generated drift
        run: >-
          git diff --exit-code --
          skills/ultra-web-design/MANIFEST.md
          skills/ultra-web-design/templates/
