name: Clean stale branches

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-stale-branches.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete known merged and bootstrap branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            "bootstrap-trigger"
            "feat/public-discovery"
            "feat/public-discovery-2"
            "feat/public-discovery-final"
            "feat/public-discovery-final-2"
            "feat/public-discovery-v3"
            "feat/public-discovery-v4"
            "feat/public-discovery-v5"
            "feat/public-discovery-v6"
            "feat/public-discovery-v7"
            "feat/public-discovery-v8"
            "feat/public-discovery-v9"
            "feat/public-discovery-v10"
            "feat/public-discovery-v11"
            "feat/public-discovery-v12"
            "feat/public-discovery-v13"
            "feat/public-discovery-v14"
            "fix/a-plus-runtime"
          )

          for branch in "${branches[@]}"; do
            ref="heads/${branch}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/${ref}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/${ref}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
