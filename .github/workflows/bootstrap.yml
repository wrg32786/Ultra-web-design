name: Bootstrap repository

on:
  push:
    paths:
      - ".bootstrap/**"
      - "scripts/bootstrap_repo.py"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct repository
        run: python scripts/bootstrap_repo.py

      - name: Build canonical skill
        run: python scripts/build_skill.py

      - name: Validate repository
        run: python scripts/validate.py

      - name: Commit repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build Ultra Web Design repository [skip ci]"
          git push
